<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#0d1117"/>
  <style>
    .q { fill: #2d2d2d; stroke: white; stroke-width: 2; }
    .a { fill: #1a6dff; stroke: white; stroke-width: 2; rx: 12; }
    .a-purple { fill: #6e40c9; stroke: white; stroke-width: 2; rx: 12; }
    .qt { fill: white; font-family: sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
    .at { fill: white; font-family: sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
    .sub { fill: #ccc; font-family: sans-serif; font-size: 10px; font-style: italic; text-anchor: middle; }
    .lbl { fill: #aaa; font-family: sans-serif; font-size: 12px; text-anchor: middle; }
    .arr { stroke: white; stroke-width: 2; fill: none; marker-end: url(#ah); }
  </style>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="white"/>
    </marker>
  </defs>

  <!-- Q1: Do you have a Mac? -->
  <polygon points="400,20 520,80 400,140 280,80" class="q"/>
  <text x="400" y="72" class="qt">Do you</text>
  <text x="400" y="92" class="qt">have a Mac?</text>

  <!-- Q2: Intel or Silicon -->
  <polygon points="200,200 320,260 200,320 80,260" class="q"/>
  <text x="200" y="252" class="qt">Intel or</text>
  <text x="200" y="272" class="qt">Silicon?</text>

  <!-- Q3: CPU 2019+ -->
  <polygon points="600,200 720,260 600,320 480,260" class="q"/>
  <text x="600" y="252" class="qt">CPU from</text>
  <text x="600" y="272" class="qt">2019 or newer?</text>

  <!-- Arrows from Q1 -->
  <line x1="340" y1="120" x2="260" y2="210" class="arr"/>
  <text x="290" y="160" class="lbl">Yes</text>
  <line x1="460" y1="120" x2="540" y2="210" class="arr"/>
  <text x="510" y="160" class="lbl">No</text>

  <!-- Ryujinx (Intel) -->
  <a xlink:href="https://github.com/GRID0-net/GRID0-ryu">
    <rect x="70" y="360" width="160" height="70" class="a"/>
    <text x="150" y="400" class="at">Ryujinx</text>
  </a>

  <!-- Citrosis -->
  <rect x="250" y="360" width="160" height="70" class="a"/>
  <text x="330" y="392" class="at">Citrosis</text>
  <text x="330" y="412" class="sub">native Swift UI, Metal</text>

  <!-- Ryujinx (CPU yes) -->
  <a xlink:href="https://github.com/GRID0-net/GRID0-ryu">
    <rect x="520" y="360" width="160" height="70" class="a"/>
    <text x="600" y="400" class="at">Ryujinx</text>
  </a>

  <!-- Citron -->
  <a xlink:href="https://github.com/GRID0-net/GRID0-citron">
    <rect x="520" y="470" width="160" height="70" class="a-purple"/>
    <text x="600" y="502" class="at">Citron</text>
    <text x="600" y="522" class="sub">better on weak hardware</text>
  </a>

  <!-- Arrows from Q2 -->
  <line x1="160" y1="310" x2="130" y2="360" class="arr"/>
  <text x="135" y="340" class="lbl">Intel</text>
  <line x1="240" y1="310" x2="300" y2="360" class="arr"/>
  <text x="275" y="340" class="lbl">Silicon</text>

  <!-- Arrows from Q3 -->
  <line x1="600" y1="310" x2="600" y2="360" class="arr"/>
  <text x="620" y="340" class="lbl">Yes</text>
  <line x1="690" y1="260" x2="720" y2="260" class="arr"/>
  <line x1="720" y1="260" x2="720" y2="505" class="arr"/>
  <line x1="720" y1="505" x2="680" y2="505" class="arr"/>
  <text x="735" y="380" class="lbl">No</text>
</svg>
